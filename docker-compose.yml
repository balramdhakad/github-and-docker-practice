services:
  web:
    build: .
    image: hello-app:1.0
    ports:
      - "8080:3000"
    environment:
      # "redis" = neeche wali service ka naam. Compose ka DNS ise IP mein badal deta hai
      REDIS_URL: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-devpassword}
      APP_VERSION: v1
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:8.4-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-devpassword}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-devpassword}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  redis_data:
